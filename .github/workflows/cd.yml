name: CD Deploy to Staging

on:
  push:
    branches: [main, master]

jobs:
  deploy-staging:
    name: Trigger Blue-Green Deploy & Verify Stage
    runs-on: ubuntu-latest
    env:
      HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ secrets.STAGING_APP_URL }}

    steps:
      - name: Trigger Stage Deployment (Container Startup Migrations + Blue-Green Release)
        if: env.HOOK_URL != ''
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Triggered staging deployment for commit ${{ github.sha }}"

      - name: Verify Public Stage Readiness (/api/health & /api/version)
        if: env.APP_URL != ''
        run: |
          BASE_URL="${{ secrets.STAGING_APP_URL }}"
          BASE_URL="${BASE_URL%/}"
          echo "Waiting for container startup migrations and Blue-Green readiness check on $BASE_URL..."
          for i in {1..24}; do
            STATUS=$(curl -sL --max-time 15 -o /dev/null -w "%{http_code}" "$BASE_URL/api/health" || true)
            echo "Attempt $i/24: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Stage healthcheck is OK (200)!"
              curl -fsSL "$BASE_URL/api/version"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging healthcheck timed out! Last HTTP status: $STATUS"
          exit 1