name: CD Deploy to Staging

on:
  push:
    branches: [main, master]

jobs:
  deploy-staging:
    name: Trigger Blue-Green Deploy & Verify Stage
    runs-on: ubuntu-latest
    env:
      HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ secrets.STAGING_APP_URL }}

    steps:
      - name: Trigger Stage Deployment (Container Startup Migrations + Blue-Green Release)
        if: env.HOOK_URL != ''
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Triggered staging deployment for commit ${{ github.sha }}"

      - name: Verify Public Stage Readiness (/api/health & /api/version)
        if: env.APP_URL != ''
        run: |
          echo "Waiting for container startup migrations and Blue-Green readiness check on ${{ secrets.STAGING_APP_URL }}..."
          for i in {1..24}; do
            STATUS=$(curl -s -o /dev/null -w "\%{http_code}" "${{ secrets.STAGING_APP_URL }}/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Stage healthcheck is OK (200)!"
              curl -fsSL "${{ secrets.STAGING_APP_URL }}/api/version"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging healthcheck timed out!"
          exit 1