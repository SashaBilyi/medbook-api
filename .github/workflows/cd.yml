name: CD Deploy to Staging

on:
  push:
    branches: [main, master]

jobs:
  deploy-staging:
    name: Migrate DB & Blue-Green Deploy to Stage
    runs-on: ubuntu-latest
    env:
      STAGING_DB_URL: ${{ secrets.STAGING_DATABASE_URL }}
      HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ secrets.STAGING_APP_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Step 1 - Blocking Schema Migrations (Expand only)
        if: env.STAGING_DB_URL != ''
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run db:migrate:schema

      - name: Step 2 - Non-blocking Data Backfill Migrations
        if: env.STAGING_DB_URL != ''
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run db:migrate:data

      - name: Step 3 - Separate Concurrent Index Creation
        if: env.STAGING_DB_URL != ''
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run db:migrate:indexes

      - name: Trigger Stage Deployment (Blue-Green Release)
        if: env.HOOK_URL != ''
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Triggered staging deployment for commit ${{ github.sha }}"

      - name: Verify Public Stage Readiness (/api/health & /api/version)
        if: env.APP_URL != ''
        run: |
          echo "Waiting for Blue-Green readiness check on ${{ secrets.STAGING_APP_URL }}..."
          for i in {1..18}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_APP_URL }}/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Stage healthcheck is OK (200)!"
              curl -fsSL "${{ secrets.STAGING_APP_URL }}/api/version"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging healthcheck timed out!"
          exit 1